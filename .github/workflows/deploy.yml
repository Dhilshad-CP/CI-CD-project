# File: .github/workflows/deploy.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ github.ref_name == 'dev' && '13.61.24.25' || github.ref_name == 'uat' && '13.60.62.233' || '16.171.194.181' }}
          username: ubuntu
          key: |
-----BEGIN OPENSSH PRIVATE KEY-----
b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
QyNTUxOQAAACDoSvy+SHoqKHk+//6gVX472hHRv4ILDXtET82GbuNOPAAAAKCRpZFAkaWR
QAAAAAtzc2gtZWQyNTUxOQAAACDoSvy+SHoqKHk+//6gVX472hHRv4ILDXtET82GbuNOPA
AAAECqGaQVuVHuWIjWUhGQ/QOdMcgf38VA/+oEX2pkNSqIwuhK/L5IeiooeT7//qBVfjva
EdG/ggsNe0RPzYZu4048AAAAFnlvdXJfZW1haWxAZXhhbXBsZS5jb20BAgMEBQYH
-----END OPENSSH PRIVATE KEY-----
          port: 22
          script: |
            # Navigate to application folder
            cd ~/myapp || mkdir ~/myapp && cd ~/myapp

            # Pull latest code or clone repository
            if [ -d .git ]; then
              git reset --hard
              git pull
            else
              git clone git@github.com:${{ github.repository }} .
            fi

            # Install dependencies
            npm install

            # Restart application with PM2
            pm2 restart all || pm2 start server.js --name myapp
