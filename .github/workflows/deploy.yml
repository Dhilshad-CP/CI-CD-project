name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set deployment secrets based on branch
        run: |
          if [ "${GITHUB_REF##*/}" = "dev" ]; then
            echo "HOST=$DEV_HOST" >> $GITHUB_ENV
            echo "USER=$DEV_USER" >> $GITHUB_ENV
            echo "KEY=$DEV_KEY" >> $GITHUB_ENV
          elif [ "${GITHUB_REF##*/}" = "uat" ]; then
            echo "HOST=$UAT_HOST" >> $GITHUB_ENV
            echo "USER=$UAT_USER" >> $GITHUB_ENV
            echo "KEY=$UAT_KEY" >> $GITHUB_ENV
          elif [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "HOST=$PROD_HOST" >> $GITHUB_ENV
            echo "USER=$PROD_USER" >> $GITHUB_ENV
            echo "KEY=$PROD_KEY" >> $GITHUB_ENV
        shell: bash
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_KEY: ${{ secrets.DEV_KEY }}
          UAT_HOST: ${{ secrets.UAT_HOST }}
          UAT_USER: ${{ secrets.UAT_USER }}
          UAT_KEY: ${{ secrets.UAT_KEY }}
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KEY: ${{ secrets.PROD_KEY }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.HOST }}
          username: ${{ env.USER }}
          key: ${{ env.KEY }}
          script: |
            cd ~/myapp || mkdir ~/myapp && cd ~/myapp
            if [ -d .git ]; then
              git reset --hard
              git pull
            else
              git clone git@github.com:${{ github.repository }} .
            fi
            npm install
            pm2 restart all || pm2 start server.js --name myapp
