# File: .github/workflows/deploy.yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - uat
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Deploy to the correct server based on branch
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ github.ref_name == 'dev' && secrets.DEV_HOST || github.ref_name == 'uat' && secrets.UAT_HOST || secrets.PROD_HOST }}
          username: ${{ github.ref_name == 'dev' && secrets.DEV_USER || github.ref_name == 'uat' && secrets.UAT_USER || secrets.PROD_USER }}
          key: ${{ github.ref_name == 'dev' && secrets.DEV_KEY || github.ref_name == 'uat' && secrets.UAT_KEY || secrets.PROD_KEY }}
          port: 22
          script: |
            # Navigate to application folder
            cd ~/myapp || mkdir ~/myapp && cd ~/myapp

            # Pull latest code or clone repository
            if [ -d .git ]; then
              git reset --hard
              git pull
            else
              git clone git@github.com:${{ github.repository }} .
            fi

            # Install dependencies
            npm install

            # Restart application with PM2
            pm2 restart all || pm2 start server.js --name myapp
